name: Verify platform
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Release version declarations
        run: npm run verify:version
      - name: Core tests and package
        run: mvn -B -ntp -f core/pom.xml verify
      - name: Web dependency install
        run: npm ci --prefix web --cache .runtime/npm-cache
      - name: Web build
        run: npm run build --prefix web
      - name: Full local protocol lifecycle
        run: node tools/ci-smoke.mjs
      - name: Install UI test browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: UI interaction tests
        run: npm run test:ui:production
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Production theme initialization and storage fallback
        run: npm run test:themes:web
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Actual browser cached page and session cursor recovery
        run: npm run test:pages:web
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Actual final Jar and production Web file diff review
        run: npm run test:diff-view
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Actual final Jar checkpoint undo and original receipt recovery
        run: npm run test:checkpoints
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Actual final Jar native terminal and forced core crash recovery
        run: npm run test:terminals:http
      - name: Actual final Jar and production Web native terminal control
        run: npm run test:terminals:ui
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Desktop dependencies
        run: node tools/install-desktop-deps.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Desktop dependency download guards
        run: node --test tools/install-desktop-deps.test.mjs tools/package-desktop.test.mjs tools/verify-version.test.mjs
      - name: Desktop connection policy
        run: node --test tools/connection.test.cjs
      - name: Session preview policy and host lifecycle
        run: npm run test:previews
      - name: Actual desktop session previews and persistent login
        if: runner.os != 'Linux'
        run: npm run test:previews:native
      - name: Actual desktop session previews with virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:previews:native
      - name: Actual core crash and original process recovery
        run: npm run test:recovery
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Actual durable root queue and explicit recovery
        run: npm run test:dispatch
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Actual selected Git workspaces and READY receipt recovery
        run: npm run test:workspaces
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Actual root workspace writers and original receipt recovery
        run: npm run test:workspace-writes
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Actual original Worker file versions and complete history
        run: npm run test:file-versions
      - name: Standalone browser and attached desktop lifecycle
        if: runner.os != 'Linux'
        run: npm run test:standalone
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Standalone lifecycle with virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:standalone
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Build desktop distribution with bundled Java
        run: npm run package:prepared
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GITHUB_TOKEN: ${{ github.token }}
      - name: Packaged application lifecycle
        run: npm run test:packaged
      - name: Actual packaged session previews without external Java or Node
        if: runner.os != 'Linux'
        run: npm run test:previews:packaged
      - name: Actual packaged session previews with virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:previews:packaged
      - name: Actual packaged themes, sidebar and preference restart
        run: npm run test:layout:packaged
      - name: Actual packaged Java workspace writer
        run: npm run test:bundled-writer
      - name: Actual packaged Java and Web native terminals without external Java or Node
        run: npm run test:terminals:packaged
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Preserve desktop distributions
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error
          retention-days: 14
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}
          include-hidden-files: true
          path: |
            core/target/surefire-reports/
            core/target/agent-workbench-core-*.jar
            web/dist/
            release/**/core/core.jar
            release/**/resources/app.asar
            release/**/Resources/app.asar
            release/**/jre/
            core/target/team-capacity-failure-*/
            core/target/team-child-start-failure-*/
            core/target/workspace-write-release-gate-*/
            core/target/checkpoint-evidence-*/
            core/target/native-pty-evidence-*/
            core/target/terminal-native-evidence-*/
            core/target/windows-long-path-evidence-*/
            core/target/windows-long-path-git-queries.jsonl
            docs/qa/smoke-*.json
            docs/qa/desktop-*.json
            docs/qa/standalone-*.json
            docs/qa/process-recovery-*.json
            docs/qa/dispatch-queue-*.json
            docs/qa/workspace-selection-*.json
            docs/qa/workspace-writes-*.json
            docs/qa/file-versions-*.json
            docs/qa/diff-view-*.json
            docs/qa/checkpoints-*.json
            docs/qa/preview-native-*.json
            docs/qa/ui-production-*.json
            docs/qa/terminals-*.json
            docs/qa/bundled-workspace-writer-*.json
            docs/qa/themes-*.json
            docs/qa/sidebar-*.json
            .runtime/themes-web-*/
            .runtime/ui-production-*/
            .runtime/page-recovery-*/
            .runtime/ci-*/
            .runtime/terminal-http-*/
            .runtime/terminal-native-ui-*/
            .runtime/preview-native-*/receipt.json
            .runtime/preview-native-*/runner-source.cjs
            .runtime/preview-native-*/artifact-fixture-source.mjs
            .runtime/preview-native-*/artifact-inputs.json
            .runtime/preview-native-*/packaged-system-path.json
            .runtime/preview-native-*/ProcessRecoveryProbe.java
            .runtime/preview-native-*/sources/
            .runtime/preview-native-*/actual-native-preview-bounds.json
            .runtime/preview-native-*/probe-classes/
            .runtime/preview-native-*/failure*.json
            .runtime/preview-native-*/*.png
            .runtime/themes-desktop-*/reports/
            .runtime/themes-desktop-*/probe-classes/
            .runtime/bundled-workspace-writer-*/
            .runtime/process-recovery-*/
            .runtime/dispatch-queue-*/reports/
            .runtime/dispatch-queue-*/fixture-classes/
            .runtime/dispatch-queue-*/queue-data/workbench.sqlite*
            .runtime/dispatch-queue-*/queue-data/workspaces/
            .runtime/dispatch-queue-*/fault-data/workbench.sqlite*
            .runtime/dispatch-queue-*/fault-data/workspaces/
