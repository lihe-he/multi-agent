name: Verify platform
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Core tests and package
        run: mvn -B -ntp -f core/pom.xml verify
      - name: Web dependency install
        run: npm ci --prefix web --cache .runtime/npm-cache
      - name: Web build
        run: npm run build --prefix web
      - name: Full local protocol lifecycle
        run: node tools/ci-smoke.mjs
      - name: Install UI test browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: UI interaction tests
        run: npm run test:ui --prefix web
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Desktop dependencies
        run: node tools/install-desktop-deps.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Desktop dependency download guards
        run: node --test tools/install-desktop-deps.test.mjs tools/package-desktop.test.mjs
      - name: Desktop connection policy
        run: node --test tools/connection.test.cjs
      - name: Actual core crash and original process recovery
        run: npm run test:recovery
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Actual durable root queue and explicit recovery
        run: npm run test:dispatch
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Actual selected Git workspaces and READY receipt recovery
        run: npm run test:workspaces
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Actual root workspace writers and original receipt recovery
        run: npm run test:workspace-writes
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Actual original Worker file versions and complete history
        run: npm run test:file-versions
      - name: Standalone browser and attached desktop lifecycle
        if: runner.os != 'Linux'
        run: npm run test:standalone
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Standalone lifecycle with virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:standalone
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Build desktop distribution with bundled Java
        run: npm run package:prepared
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GITHUB_TOKEN: ${{ github.token }}
      - name: Packaged application lifecycle
        run: npm run test:packaged
      - name: Actual packaged Java workspace writer
        run: npm run test:bundled-writer
      - name: Preserve desktop distributions
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error
          retention-days: 14
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}
          include-hidden-files: true
          path: |
            core/target/surefire-reports/
            core/target/agent-workbench-core-*.jar
            web/dist/
            release/**/core/core.jar
            core/target/team-capacity-failure-*/
            core/target/team-child-start-failure-*/
            core/target/workspace-write-release-gate-*/
            docs/qa/smoke-*.json
            docs/qa/desktop-*.json
            docs/qa/standalone-*.json
            docs/qa/process-recovery-*.json
            docs/qa/dispatch-queue-*.json
            docs/qa/workspace-selection-*.json
            docs/qa/workspace-writes-*.json
            docs/qa/file-versions-*.json
            docs/qa/bundled-workspace-writer-*.json
            .runtime/bundled-workspace-writer-*/
            .runtime/process-recovery-*/
            .runtime/dispatch-queue-*/reports/
            .runtime/dispatch-queue-*/fixture-classes/
            .runtime/dispatch-queue-*/queue-data/workbench.sqlite*
            .runtime/dispatch-queue-*/fault-data/workbench.sqlite*
            .runtime/workspace-selection-*/reports/
            .runtime/workspace-selection-*/fixture-classes/
            .runtime/workspace-selection-*/data/workbench.sqlite*
            .runtime/workspace-selection-*/data/workspaces/
            .runtime/workspace-selection-*/中文 空格 source/
            .runtime/workspace-writes-*/reports/
            .runtime/workspace-writes-*/fixture-classes/
            .runtime/workspace-writes-*/data/workbench.sqlite*
            .runtime/workspace-writes-*/data/workspaces/
            .runtime/workspace-writes-*/中文 write source/
            .runtime/file-versions-*/reports/
            .runtime/file-versions-*/fixture-classes/
            .runtime/file-versions-*/data/workbench.sqlite*
            .runtime/file-versions-*/data/workspaces/
            .runtime/file-versions-*/中文 file version source/
            .runtime/desktop-deps-*.log
            .runtime/desktop-deps-verified.json
            .runtime/desktop-package-*.log
            .runtime/desktop-package-verified.json
            .runtime/builder-verified-*/.official-*/verified.json
            .runtime/desktop-qa-*/probe-classes/
            docs/qa/desktop-home.png
            web/test-results/
            web/qa/
