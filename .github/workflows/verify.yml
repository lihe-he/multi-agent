name: Verify platform
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Core tests and package
        run: mvn -B -ntp -f core/pom.xml verify
      - name: Web dependency install
        run: npm ci --prefix web --cache .runtime/npm-cache
      - name: Web build
        run: npm run build --prefix web
      - name: Full local protocol lifecycle
        run: node tools/ci-smoke.mjs
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}
          path: |
            core/target/surefire-reports/
            docs/qa/smoke-*.json
