            core/target/diff-view-evidence-*/
            .runtime/checkpoints-*/reports/
            .runtime/checkpoints-*/fixture-classes/
            .runtime/checkpoints-*/data/workbench.sqlite*
            .runtime/checkpoints-*/data/workspaces/
            .runtime/checkpoints-*/data/checkpoints/
            .runtime/checkpoints-*/中文 checkpoint source/
            .runtime/desktop-deps-*.log
            .runtime/desktop-deps-verified.json
            .runtime/desktop-package-*.log
            .runtime/desktop-package-verified.json
            .runtime/builder-verified-*/.official-*/verified.json
            .runtime/desktop-qa-*/probe-classes/
            docs/qa/desktop-home.png
            web/test-results/
            web/qa/
